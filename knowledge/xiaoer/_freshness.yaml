# 原创保护 (OP) 知识库保鲜台账
# 对齐 07-21 会议「知识保鲜」要求：按模块维度定期核验，staleness_days > 30 的 P0 模块自动进入待保鲜队列
# 维护方式：commit 变更 / PRD 新增 / 规则校准 三类触发时更新对应模块的 last_verified 与 source_commit

